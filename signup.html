<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FTCIntel - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast-wrapper"></div>

<div class="auth-wrap">
    <div class="auth-box">
        <div class="logo-container">
            <img src="https://i.ibb.co/sJtbvLzP/logo-x2.png" class="main-logo" alt="FTCIntel">
        </div>

        <p style="font-size:20px; font-weight:800; margin-bottom:6px">Register Team</p>
        <p style="font-size:13px; color:var(--text-dim); margin-bottom:28px">Your credentials will be sent by email.</p>

        <div class="field">
            <label>Team Number</label>
            <input type="number" id="team-id" placeholder="e.g. 19121">
        </div>
        <div class="field">
            <label>Contact Email</label>
            <input type="email" id="email-id" placeholder="team@gmail.com">
        </div>

        <button onclick="handleSignup()" id="btn-signup" class="btn-primary">REQUEST ACCESS</button>

        <p style="text-align:center; margin-top:24px; font-size:13px; color:var(--text-dim)">
            Already registered? <a href="login.html" style="color:var(--accent); font-weight:700; text-decoration:none">Login</a>
        </p>
    </div>
    <div class="footer-link"><a href="tos.html">ToS & Privacy</a></div>
</div>

<script src="config.js"></script>
<script src="utils.js"></script>
<script>
    function showToast(msg) {
        const w = document.getElementById('toast-wrapper');
        const t = document.createElement('div');
        t.className = 'toast'; t.innerText = msg;
        w.appendChild(t); setTimeout(() => t.remove(), 4000);
    }

    async function handleSignup() {
        const team  = sanitizeInput(document.getElementById('team-id').value, 10);
        const email = sanitizeInput(document.getElementById('email-id').value, 100);
        const btn   = document.getElementById('btn-signup');
        if (!team || !email) return showToast("Please fill all fields.");
        btn.disabled = true; btn.innerText = "SENDING...";
        try {
            const signed = await buildSignedParams({ action: 'signup', team, email });
            const r = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
            const data = await r.json();
            if (data.success) {
                const uname = data.username || '';
                showToast("Registered as " + uname + ". Check your email for credentials.");
                setTimeout(() => window.location.href = 'login.html', 3500);
            } else {
                showToast(data.msg || "Registration failed.");
                btn.disabled = false; btn.innerText = "REQUEST ACCESS";
            }
        } catch(e) {
            showToast("Connection error.");
            btn.disabled = false; btn.innerText = "REQUEST ACCESS";
        }
    }
</script>
</body>
</html>
