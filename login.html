        async function loadEvents() {
            const sel = document.getElementById('event-select');
            try {
                const signed = await buildSignedParams({
                    action: 'getEvents',
                    myTeam: sessionStorage.getItem('team'),
                    myToken: sessionStorage.getItem('token')
                });
                const r = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
                const data = await r.json();
                if(data.success && data.events && data.events.length > 0) {
                    sel.innerHTML = data.events.map(e =>
                        `<option value="${escapeHtml(e.code)}">${escapeHtml(e.name)}</option>`
                    ).join('');
                } else {
                    sel.innerHTML = '<option value="">No events available</option>';
                }
            } catch(e) {
                sel.innerHTML = '<option value="">Could not load events</option>';
            }
        }

        async function handleSessionSetup() {
            const scoutId   = sanitizeInput(document.getElementById('scout-id').value.trim(), 20);
            const eventSel  = document.getElementById('event-select');
            const eventCode = eventSel.value;
            const eventName = eventSel.options[eventSel.selectedIndex]?.text || '';

            if(!scoutId) return showToast("Please enter your Scout ID.");
            if(!eventCode) return showToast("Please select an event.");

            const btn = document.getElementById('btn-enter');
            btn.disabled = true; btn.innerText = "VERIFYING...";

            try {
                const signed = await buildSignedParams({
                    action: 'validateScouter',
                    myTeam: sessionStorage.getItem('team'),
                    myToken: sessionStorage.getItem('token'),
                    scouterId: scoutId
                });
                const r = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
                const data = await r.json();
                if(data.success) {
                    sessionStorage.setItem('scoutId', scoutId);
                    sessionStorage.setItem('eventCode', eventCode);
                    sessionStorage.setItem('eventName', eventName);
                    window.location.href = "dashboard.html";
                } else {
                    showToast(data.msg || "Scout ID not recognized.");
                    btn.disabled = false; btn.innerText = "ENTER DASHBOARD";
                }
            } catch(e) {
                showToast("Connection error.");
                btn.disabled = false; btn.innerText = "ENTER DASHBOARD";
            }
        }

        async function handleAdminLogin() {
            const pass = sanitizeInput(document.getElementById('admin-pass-login').value.trim(), 60);
            if(!pass) return showToast("Enter admin password.");
            const btn = document.getElementById('btn-admin-login');
            btn.disabled = true; btn.innerText = "VERIFYING...";
            try {
                const signed = await buildSignedParams({
                    action: 'adminauth',
                    myTeam: sessionStorage.getItem('team'),
                    myToken: sessionStorage.getItem('token'),
                    adminPass: pass
                });
                const r = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
                const j = await r.json();
                if(j.success) {
                    sessionStorage.setItem('adminPass', pass);
                    window.location.href = 'admin.html';
                } else {
                    showToast("Invalid admin password.");
                    btn.disabled = false; btn.innerText = "ENTER ADMIN PANEL";
                }
            } catch(e) {
                showToast("Connection error.");
                btn.disabled = false; btn.innerText = "ENTER ADMIN PANEL";
            }
        }

        function toggleAddEvent() {
            const form = document.getElementById('add-event-form');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        async function submitAddEvent() {
            const code = sanitizeInput(document.getElementById('new-event-code').value.trim(), 30);
            const name = sanitizeInput(document.getElementById('new-event-name').value.trim(), 100);
            const date = document.getElementById('new-event-date').value;

            if(!code || !name) return showToast("Code and Name are required.");

            const btn = document.getElementById('btn-add-event');
            btn.disabled = true; btn.innerText = "SAVING...";

            try {
                const signed = await buildSignedParams({
                    action: 'addEvent',
                    myTeam: sessionStorage.getItem('team'),
                    myToken: sessionStorage.getItem('token'),
                    code, name, date
                });
                const r = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
                const data = await r.json();
                if(data.success) {
                    showToast("Event added!");
                    document.getElementById('new-event-code').value = '';

                    showToast(data.msg || "Failed to add event.");
                }
            } catch(e) {
                showToast("Connection error.");
            } finally {

            }
        }
