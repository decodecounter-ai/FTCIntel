<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FTCIntel - Profile</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .info-row {
            display: flex;
            align-items: center;
            padding: 13px 0;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }
        .info-row:last-child { border-bottom: none; padding-bottom: 0; }
        .info-row:first-child { padding-top: 0; }
        .info-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            width: 90px;
            flex-shrink: 0;
        }
        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            flex: 1;
            min-width: 0;
        }
        .info-edit-area { flex: 1; display: none; align-items: center; gap: 8px; min-width: 0; }
        .info-edit-area input { flex: 1; min-width: 0; font-size: 13px; padding: 8px 12px; }
        .edit-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 4px;
            flex-shrink: 0;
            opacity: 0.6;
            transition: opacity 0.15s, color 0.15s;
            display: flex;
            align-items: center;
        }
        .edit-btn:hover { opacity: 1; color: var(--accent); }
        .save-btn {
            background: none;
            border: none;
            color: #22c55e;
            cursor: pointer;
            padding: 4px 6px;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .cancel-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 4px 6px;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .verified-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: #22c55e; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); padding: 3px 9px; border-radius: 4px; }
        .unverified-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--text-dim); background: var(--input-bg); border: 1px solid var(--border); padding: 3px 9px; border-radius: 4px; }
        .deletion-card { background: rgba(249,115,22,0.08); border: 1px solid rgba(249,115,22,0.35); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }
    </style>
</head>
<body>
<div id="toast-wrapper"></div>

<div class="auth-wrap" style="justify-content:flex-start; padding-top:48px; padding-bottom:48px">
    <div style="width:100%; max-width:480px">

        <a href="dashboard.html" style="color:var(--text-dim); text-decoration:none; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px; margin-bottom:28px">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Back
        </a>

        <p style="font-size:22px; font-weight:800; margin-bottom:6px">Profile</p>
        <p style="font-size:13px; color:var(--text-dim); margin-bottom:28px">Your account information</p>

        <!-- Deletion warning -->
        <div id="deletion-card" class="deletion-card" style="display:none">
            <p style="font-size:11px; font-weight:700; color:#f97316; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px">Account Scheduled for Deletion</p>
            <p style="font-size:13px; color:#f97316; margin-bottom:8px" id="deletion-deadline"></p>
            <p style="font-size:13px; color:var(--text-dim)">Change your team number below to keep your account. Your scouting data is not affected.</p>
        </div>

        <!-- Info card -->
        <div class="card">
            <p class="card-title">Account Info</p>

            <!-- Username — not editable -->
            <div class="info-row">
                <span class="info-label">Username</span>
                <span class="info-value" id="pf-username">—</span>
            </div>

            <!-- Team Number — editable -->
            <div class="info-row" id="row-team">
                <span class="info-label">Team</span>
                <span class="info-value" id="pf-team">—</span>
                <div class="info-edit-area" id="edit-team">
                    <input type="text" id="inp-team" placeholder="e.g. 20000 or #G20000.1" inputmode="numeric">
                    <button class="save-btn" onclick="saveTeam()">SAVE</button>
                    <button class="cancel-btn" onclick="cancelEdit('team')">✕</button>
                </div>
                <button class="edit-btn" id="pencil-team" onclick="startEdit('team')" title="Change team number">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
            </div>

            <!-- Email — editable -->
            <div class="info-row" id="row-email">
                <span class="info-label">Email</span>
                <span class="info-value" id="pf-email" style="font-size:13px; word-break:break-all">—</span>
                <div class="info-edit-area" id="edit-email">
                    <input type="email" id="inp-email" placeholder="New email address">
                    <button class="save-btn" onclick="saveEmail()">SAVE</button>
                    <button class="cancel-btn" onclick="cancelEdit('email')">✕</button>
                </div>
                <button class="edit-btn" id="pencil-email" onclick="startEdit('email')" title="Change email">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
            </div>

            <!-- Joined — not editable -->
            <div class="info-row">
                <span class="info-label">Joined</span>
                <span class="info-value" id="pf-joined" style="color:var(--text-dim); font-size:13px">—</span>
            </div>

            <!-- Verification status -->
            <div class="info-row" style="flex-wrap:wrap; gap:8px">
                <span class="info-label">Status</span>
                <span id="pf-status-badge"><span class="unverified-badge">&#9675; Unverified</span></span>
                <a id="pf-claim-btn" href="claim.html" style="display:none; font-size:12px; font-weight:700; color:var(--accent); text-decoration:none; margin-left:auto">+ Own this team</a>
            </div>
        </div>

        <div class="footer-link"><a href="tos.html">ToS & Privacy</a></div>
    </div>
</div>

<script src="config.js"></script>
<script src="utils.js"></script>
<script>
    function showToast(msg) {
        const w = document.getElementById('toast-wrapper');
        const t = document.createElement('div');
        t.className = 'toast'; t.innerText = msg;
        w.appendChild(t); setTimeout(() => t.remove(), 3500);
    }

    window.addEventListener('DOMContentLoaded', async function() {
        const team  = sessionStorage.getItem('team');
        const token = sessionStorage.getItem('token');
        if (!team || !token) { window.location.href = 'login.html'; return; }
        loadProfile(team, token);
    });

    async function loadProfile(team, token) {
        try {
            const signed = await buildSignedParams({ action: 'getprofile', myTeam: team, myToken: token });
            const r    = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
            const data = await r.json();
            if (!data.success) { showToast("Could not load profile."); return; }
            renderProfile(data);
        } catch(e) { showToast("Connection error."); }
    }

    function renderProfile(data) {
        document.getElementById('pf-username').textContent = data.username || '—';
        document.getElementById('pf-team').textContent     = data.teamId   || '—';
        document.getElementById('pf-email').textContent    = data.email    || '—';
        const d = new Date(data.joinDate);
        document.getElementById('pf-joined').textContent = isNaN(d) ? (data.joinDate || '—') : d.toLocaleDateString();

        const badge    = document.getElementById('pf-status-badge');
        const claimBtn = document.getElementById('pf-claim-btn');
        if (data.verified) {
            badge.innerHTML = '<span class="verified-badge">&#10003; Verified</span>';
        } else {
            badge.innerHTML = '<span class="unverified-badge">&#9675; Unverified</span>';
            if (!data.deletionAt) claimBtn.style.display = 'block';
        }

        if (data.deletionAt) {
            const deadline = new Date(data.deletionAt);
            document.getElementById('deletion-deadline').textContent =
                'Deadline: ' + deadline.toLocaleDateString() + ' at ' + deadline.toLocaleTimeString();
            document.getElementById('deletion-card').style.display = 'block';
        }
    }

    // ── Inline edit helpers ──────────────────────────────────────────────────

    function startEdit(field) {
        document.getElementById('pf-' + field).style.display      = 'none';
        document.getElementById('pencil-' + field).style.display  = 'none';
        const area = document.getElementById('edit-' + field);
        area.style.display = 'flex';
        const input = document.getElementById('inp-' + field);
        input.value = document.getElementById('pf-' + field).textContent.trim();
        input.focus();
    }

    function cancelEdit(field) {
        document.getElementById('edit-' + field).style.display    = 'none';
        document.getElementById('pf-' + field).style.display      = '';
        document.getElementById('pencil-' + field).style.display  = '';
    }

    // ── Save email ───────────────────────────────────────────────────────────

    async function saveEmail() {
        const team     = sessionStorage.getItem('team');
        const token    = sessionStorage.getItem('token');
        const newEmail = sanitizeInput(document.getElementById('inp-email').value.trim(), 100);
        if (!newEmail) return showToast("Enter a new email address.");
        try {
            const signed = await buildSignedParams({ action: 'updateemail', myTeam: team, myToken: token, newEmail });
            const r    = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
            const data = await r.json();
            if (data.success) {
                document.getElementById('pf-email').textContent = newEmail;
                cancelEdit('email');
                showToast("Email updated.");
            } else {
                showToast(data.msg || "Failed to update email.");
            }
        } catch(e) { showToast("Connection error."); }
    }

    // ── Save team number ─────────────────────────────────────────────────────

    async function saveTeam() {
        const team  = sessionStorage.getItem('team');
        const token = sessionStorage.getItem('token');
        const raw   = document.getElementById('inp-team').value.trim();
        const match = raw.match(/\d+/);
        const newTeam = match ? match[0] : '';
        if (!newTeam) return showToast("Enter a team number.");
        if (!confirm("Change team to #" + newTeam + "? Your verification status will be cleared.")) return;
        try {
            const signed = await buildSignedParams({ action: 'updateteam', myTeam: team, myToken: token, newTeam });
            const r    = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
            const data = await r.json();
            if (data.success) {
                sessionStorage.setItem('team', data.newTeam);
                sessionStorage.setItem('username', data.newUsername);
                sessionStorage.setItem('verified', 'false');
                sessionStorage.removeItem('deletionAt');
                document.getElementById('pf-team').textContent     = data.newTeam;
                document.getElementById('pf-username').textContent = data.newUsername;
                cancelEdit('team');
                showToast("Team changed. New username: " + data.newUsername);
                loadProfile(data.newTeam, token);
            } else {
                showToast(data.msg || "Failed to change team.");
            }
        } catch(e) { showToast("Connection error."); }
    }
</script>
</body>
</html>
