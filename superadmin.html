<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FTCIntel - Super Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast-wrapper"></div>

    <!-- Token Modal -->
    <div id="token-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(5,5,8,0.97); z-index:9999; flex-direction:column; align-items:center; justify-content:center;">
        <div class="card" style="width:90%; max-width:420px; text-align:center">
            <p style="font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:1px; margin-bottom:12px">Token Reset</p>
            <p style="font-size:13px; color:var(--text-dim); margin-bottom:16px">Copy this token — it will not be shown again.</p>
            <div id="token-display" style="font-size:17px; font-weight:800; color:var(--success); letter-spacing:2px; padding:16px; background:var(--input-bg); border-radius:var(--radius); margin-bottom:16px; word-break:break-all; border:1px solid var(--success)"></div>
            <button onclick="copyToken()" class="btn-primary" style="background:var(--input-bg); border:1px solid var(--accent); color:var(--accent); margin-bottom:8px">COPY TOKEN</button>
            <button onclick="closeTokenModal()" class="btn-primary">CLOSE</button>
        </div>
    </div>

    <!-- ─── STEP 1: Credentials + Security Questions ─── -->
    <div id="screen-credentials" style="display:flex; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-color); z-index:10000; flex-direction:column; align-items:center; justify-content:center;">
        <div class="container">
            <div class="logo-container">
                <img src="https://i.ibb.co/sJtbvLzP/logo-x2.png" class="main-logo" alt="FTCIntel">
            </div>
            <div class="card">
                <p style="font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:1px; margin-bottom:20px">Super Admin Access</p>

                <div style="margin-bottom:16px">
                    <label>Master Password</label>
                    <input type="password" id="inp-pass" placeholder="••••••••">
                </div>
                <div style="margin-bottom:16px">
                    <label>Security Question 1: Which team are you part of?</label>
                    <input type="text" id="inp-q1" placeholder="Team number">
                </div>
                <div style="margin-bottom:24px">
                    <label>Security Question 2: What is your girlfriend's name?</label>
                    <input type="text" id="inp-q2" placeholder="Name"
                           onkeydown="if(event.key==='Enter') handleCredentialsSubmit()">
                </div>
                <button onclick="handleCredentialsSubmit()" id="btn-creds" class="btn-primary">CONTINUE</button>
            </div>
        </div>
    </div>

    <!-- ─── STEP 2: OTP ─── -->
    <div id="screen-otp" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-color); z-index:10000; flex-direction:column; align-items:center; justify-content:center;">
        <div class="container">
            <div class="logo-container">
                <img src="https://i.ibb.co/sJtbvLzP/logo-x2.png" class="main-logo" alt="FTCIntel">
            </div>
            <div class="card">
                <p style="font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px">Verification Code</p>
                <p style="font-size:13px; color:var(--text-dim); margin-bottom:20px">A 6-digit code was sent to your email. Enter it within 2 minutes.</p>
                <div style="margin-bottom:24px">
                    <label>Security Code</label>
                    <input type="text" id="inp-otp" placeholder="000000" maxlength="6"
                           style="letter-spacing:6px; font-size:22px; text-align:center"
                           onkeydown="if(event.key==='Enter') handleOtpSubmit()">
                </div>
                <button onclick="handleOtpSubmit()" id="btn-otp" class="btn-primary">VERIFY</button>
                <button onclick="backToCredentials()" style="background:none; border:none; color:var(--text-dim); font-size:13px; cursor:pointer; display:block; margin:12px auto 0">Back</button>
            </div>
        </div>
    </div>

    <!-- ─── MAIN PANEL ─── -->
    <div id="main-container" class="container" style="display:none">
        <div class="logo-container">
            <img src="https://i.ibb.co/sJtbvLzP/logo-x2.png" class="main-logo" alt="FTCIntel">
        </div>

        <div class="session-info" style="margin-bottom:20px">
            <span style="font-weight:700; color:var(--accent)">SUPER ADMIN</span>
            <button onclick="exitSuperAdmin()" style="background:none; border:none; color:var(--error); font-size:13px; font-weight:bold; cursor:pointer; padding:0">EXIT</button>
        </div>

        <!-- Tab Nav -->
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr 1fr; gap:6px; margin-bottom:20px">
            <button class="btn-primary" id="snav-teams"    onclick="showSuperTab('teams')"    style="margin:0; font-size:11px; padding:12px 4px">TEAMS</button>
            <button class="btn-primary" id="snav-logs"     onclick="showSuperTab('logs')"     style="margin:0; font-size:11px; padding:12px 4px; background:var(--card-bg); border:1px solid var(--border)">LOGS</button>
            <button class="btn-primary" id="snav-scouters" onclick="showSuperTab('scouters')" style="margin:0; font-size:11px; padding:12px 4px; background:var(--card-bg); border:1px solid var(--border)">SCOUTS</button>
            <button class="btn-primary" id="snav-events"   onclick="showSuperTab('events')"   style="margin:0; font-size:11px; padding:12px 4px; background:var(--card-bg); border:1px solid var(--border)">EVENTS</button>
            <button class="btn-primary" id="snav-mail"     onclick="showSuperTab('mail')"     style="margin:0; font-size:11px; padding:12px 4px; background:var(--card-bg); border:1px solid var(--border)">MAIL</button>
        </div>

        <!-- TEAMS TAB -->
        <div id="stab-teams">
            <div id="teams-wrap" class="table-scroll">
                <p style="padding:20px; text-align:center; color:var(--text-dim)">Loading...</p>
            </div>
        </div>

        <!-- LOGS TAB -->
        <div id="stab-logs" style="display:none">
            <div id="logs-info" style="font-size:12px; color:var(--text-dim); margin-bottom:8px; text-align:right"></div>
            <div id="logs-wrap" class="table-scroll">
                <p style="padding:20px; text-align:center; color:var(--text-dim)">Loading...</p>
            </div>
        </div>

        <!-- SCOUTERS TAB -->
        <div id="stab-scouters" style="display:none">
            <div id="scouters-wrap" class="table-scroll">
                <p style="padding:20px; text-align:center; color:var(--text-dim)">Loading...</p>
            </div>
        </div>

        <!-- EVENTS TAB -->
        <div id="stab-events" style="display:none">
            <div id="events-wrap" class="table-scroll">
                <p style="padding:20px; text-align:center; color:var(--text-dim)">Loading...</p>
            </div>
        </div>

        <!-- MAIL TAB -->
        <div id="stab-mail" style="display:none">
            <div class="card">
                <p style="font-size:11px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:18px">Send Email</p>

                <div style="margin-bottom:14px">
                    <label>Recipients</label>
                    <div style="background:var(--input-bg); border:1px solid var(--border); border-radius:var(--radius); padding:10px">
                        <input type="text" id="mail-filter" placeholder="Filter by team ID or email..."
                               oninput="filterMailRecipients(this.value)"
                               style="width:100%; background:transparent; border:none; border-bottom:1px solid var(--border); color:white; outline:none; font-size:13px; padding:4px 0; margin-bottom:8px; box-sizing:border-box">
                        <div id="mail-team-list" style="max-height:160px; overflow-y:auto; padding-top:6px"></div>
                    </div>
                    <p id="mail-selected-count" style="font-size:12px; color:var(--text-dim); margin-top:6px">0 recipients selected</p>
                </div>

                <div style="margin-bottom:14px">
                    <label>Subject</label>
                    <input type="text" id="mail-subject" placeholder="Email subject..." maxlength="200">
                </div>

                <div style="margin-bottom:4px">
                    <label>Message</label>
                    <textarea id="mail-body" maxlength="1000"
                        oninput="document.getElementById('body-counter').textContent=this.value.length+'/1000'"
                        style="width:100%; background:var(--input-bg); border:1px solid var(--border); color:white; padding:14px; border-radius:var(--radius); font-size:14px; outline:none; resize:vertical; min-height:130px; font-family:inherit; box-sizing:border-box"></textarea>
                </div>
                <p id="body-counter" style="text-align:right; font-size:12px; color:var(--text-dim); margin-bottom:14px">0/1000</p>

                <button onclick="sendSuperMail()" id="btn-send-mail" class="btn-primary" style="margin:0">SEND EMAIL</button>
            </div>
        </div>

        <button onclick="exitSuperAdmin()" style="background:transparent; color:var(--error); margin:30px auto; display:block; border:none; font-weight:bold; cursor:pointer;">LOGOUT</button>
    </div>

    <div class="footer-separator"></div>
    <div class="footer-link-container"><a href="tos.html">ToS &amp; Privacy</a></div>

    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script>
        // Session token is kept only in memory — never in storage
        let sessionTokenVar = null;
        let teamsCache      = [];

        // ─── TOAST ───────────────────────────────────────────────────────────
        function showToast(msg) {
            const w = document.getElementById('toast-wrapper');
            const t = document.createElement('div'); t.className = 'toast'; t.innerText = msg;
            w.appendChild(t); setTimeout(() => t.remove(), 3500);
        }

        // ─── STEP 1: Submit credentials + security questions ─────────────────
        async function handleCredentialsSubmit() {
            const pass = document.getElementById('inp-pass').value;
            const q1   = document.getElementById('inp-q1').value.trim();
            const q2   = document.getElementById('inp-q2').value.trim();

            if (!pass || !q1 || !q2) return showToast("Fill in all fields.");

            const btn = document.getElementById('btn-creds');
            btn.disabled = true; btn.innerText = "VERIFYING...";

            try {
                const signed = await buildSignedParams({
                    action: 'supersendotp',
                    superPass: pass,
                    q1,
                    q2
                });
                const r = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
                const j = await r.json();

                if (j.success) {
                    // Clear sensitive inputs
                    document.getElementById('inp-pass').value = '';
                    document.getElementById('inp-q1').value   = '';
                    document.getElementById('inp-q2').value   = '';
                    // Move to OTP screen
                    document.getElementById('screen-credentials').style.display = 'none';
                    document.getElementById('screen-otp').style.display         = 'flex';
                    document.getElementById('inp-otp').value = '';
                    document.getElementById('inp-otp').focus();
                    showToast("Code sent to your email.");
                } else {
                    showToast(j.msg || "Verification failed.");
                    btn.disabled = false; btn.innerText = "CONTINUE";
                }
            } catch(e) {
                showToast("Connection error.");
                btn.disabled = false; btn.innerText = "CONTINUE";
            }
        }

        function backToCredentials() {
            document.getElementById('screen-otp').style.display          = 'none';
            document.getElementById('screen-credentials').style.display  = 'flex';
            document.getElementById('btn-creds').disabled = false;
            document.getElementById('btn-creds').innerText = 'CONTINUE';
        }

        // ─── STEP 2: Submit OTP ───────────────────────────────────────────────
        async function handleOtpSubmit() {
            const otp = document.getElementById('inp-otp').value.trim();
            if (!otp) return showToast("Enter the verification code.");

            const btn = document.getElementById('btn-otp');
            btn.disabled = true; btn.innerText = "VERIFYING...";

            try {
                const signed = await buildSignedParams({ action: 'superverifyotp', otp });
                const r = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
                const j = await r.json();

                if (j.success) {
                    sessionTokenVar = j.sessionToken;
                    document.getElementById('inp-otp').value = '';
                    document.getElementById('screen-otp').style.display    = 'none';
                    document.getElementById('main-container').style.display = 'block';
                    loadTeams();
                } else {
                    showToast(j.msg || "Invalid code.");
                    btn.disabled = false; btn.innerText = "VERIFY";
                }
            } catch(e) {
                showToast("Connection error.");
                btn.disabled = false; btn.innerText = "VERIFY";
            }
        }

        // ─── LOGOUT ───────────────────────────────────────────────────────────
        async function exitSuperAdmin() {
            try {
                if (sessionTokenVar) {
                    const signed = await buildSignedParams({ action: 'superlogout', sessionToken: sessionTokenVar });
                    await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
                }
            } catch(e) {}
            sessionTokenVar = null;
            teamsCache      = [];
            document.getElementById('main-container').style.display        = 'none';
            document.getElementById('screen-credentials').style.display    = 'flex';
            document.getElementById('btn-creds').disabled  = false;
            document.getElementById('btn-creds').innerText = 'CONTINUE';
        }

        // ─── TAB NAVIGATION ──────────────────────────────────────────────────
        function showSuperTab(id) {
            ['teams','logs','scouters','events','mail'].forEach(t => {
                document.getElementById('stab-'+t).style.display = 'none';
                const n = document.getElementById('snav-'+t);
                n.style.background = 'var(--card-bg)';
                n.style.border     = '1px solid var(--border)';
                n.style.color      = 'white';
            });
            document.getElementById('stab-'+id).style.display = 'block';
            const active = document.getElementById('snav-'+id);
            active.style.background = 'var(--accent)';
            active.style.border     = 'none';

            if (id === 'teams')    loadTeams();
            if (id === 'logs')     loadLogs();
            if (id === 'scouters') loadAllScouters();
            if (id === 'events')   loadAllEvents();
            if (id === 'mail')     populateMailRecipients();
        }

        // ─── TOKEN MODAL ─────────────────────────────────────────────────────
        function showTokenModal(newToken) {
            document.getElementById('token-display').textContent = newToken;
            document.getElementById('token-modal').style.display = 'flex';
        }
        function closeTokenModal() {
            document.getElementById('token-modal').style.display = 'none';
            document.getElementById('token-display').textContent = '';
        }
        async function copyToken() {
            const t = document.getElementById('token-display').textContent;
            try {
                await navigator.clipboard.writeText(t);
                showToast("Copied!");
            } catch(e) {
                showToast("Could not copy — select manually.");
            }
        }

        // ─── TEAMS ───────────────────────────────────────────────────────────
        async function loadTeams() {
            const wrap = document.getElementById('teams-wrap');
            wrap.innerHTML = "<p style='padding:20px; text-align:center; color:var(--text-dim)'>Loading...</p>";
            try {
                const signed = await buildSignedParams({ action: 'supergetteams', sessionToken: sessionTokenVar });
                const r = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
                const j = await r.json();
                if (j.success) {
                    teamsCache = j.teams;
                    renderTeamsTable(j.teams);
                } else {
                    wrap.innerHTML = `<p style='padding:20px; color:var(--error)'>${escapeHtml(j.msg)}</p>`;
                }
            } catch(e) { wrap.innerHTML = "<p style='padding:20px; color:var(--error)'>Error.</p>"; }
        }

        function renderTeamsTable(teams) {
            const wrap = document.getElementById('teams-wrap');
            if (!teams.length) {
                wrap.innerHTML = "<p style='padding:20px; text-align:center; color:var(--text-dim)'>No teams registered.</p>";
                return;
            }
            let h = `<table><thead><tr>
                <th>Team ID</th><th>Email</th><th>Registered</th><th>Expiry</th><th style="width:150px">Actions</th>
            </tr></thead><tbody>`;
            teams.forEach(t => {
                h += `<tr>
                    <td style="font-weight:700; color:var(--accent)">${escapeHtml(t.teamId)}</td>
                    <td>${escapeHtml(t.email)}</td>
                    <td style="font-size:12px; color:var(--text-dim)">${escapeHtml(t.date)}</td>
                    <td style="font-size:12px; color:var(--text-dim)">${escapeHtml(t.expiry)}</td>
                    <td style="white-space:nowrap">
                        <button onclick="resetToken('${escapeHtml(t.teamId)}')" style="background:none; border:none; color:var(--accent); cursor:pointer; font-size:12px; font-weight:bold; padding:2px 6px">RESET</button>
                        <button onclick="deleteTeam('${escapeHtml(t.teamId)}')" style="background:none; border:none; color:var(--error); cursor:pointer; font-size:12px; font-weight:bold; padding:2px 6px">DELETE</button>
                    </td>
                </tr>`;
            });
            wrap.innerHTML = h + '</tbody></table>';
        }

        async function resetToken(teamId) {
            if (!confirm(`Reset token for team ${teamId}? A new token will be emailed to them.`)) return;
            try {
                const signed = await buildSignedParams({ action: 'superresettoken', sessionToken: sessionTokenVar, teamId });
                const r = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
                const j = await r.json();
                if (j.success) {
                    showToast("Token resetat!");
                    showTokenModal(j.newToken);
                    loadTeams();
                } else {
                    showToast(j.msg || "Error.");
                }
            } catch(e) { showToast("Connection error."); }
        }

        async function deleteTeam(teamId) {
            if (!confirm(`DELETE team ${teamId}?\n\nThis will permanently remove:\n• Credentials\n• Match database\n• Events\n• Scouters\n\nThis cannot be undone.`)) return;
            try {
                const signed = await buildSignedParams({ action: 'superdeleteteam', sessionToken: sessionTokenVar, teamId });
                const r = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
                const j = await r.json();
                if (j.success) {
                    showToast(`Team ${teamId} deleted.`);
                    loadTeams();
                } else {
                    showToast(j.msg || "Error.");
                }
            } catch(e) { showToast("Connection error."); }
        }

        // ─── LOGS ────────────────────────────────────────────────────────────
        async function loadLogs() {
            const wrap = document.getElementById('logs-wrap');
            const info = document.getElementById('logs-info');
            wrap.innerHTML = "<p style='padding:20px; text-align:center; color:var(--text-dim)'>Loading...</p>";
            try {
                const signed = await buildSignedParams({ action: 'supergetlogs', sessionToken: sessionTokenVar });
                const r = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
                const j = await r.json();
                if (j.success) {
                    if (j.total > 300) {
                        info.textContent = `Showing last 300 of ${j.total} log entries.`;
                    } else {
                        info.textContent = `${j.logs.length > 1 ? j.logs.length - 1 : 0} log entries.`;
                    }
                    if (!j.logs || j.logs.length <= 1) {
                        wrap.innerHTML = "<p style='padding:20px; text-align:center; color:var(--text-dim)'>No logs.</p>";
                        return;
                    }
                    let h = '<table><thead><tr>';
                    j.logs[0].forEach(col => h += `<th>${escapeHtml(col)}</th>`);
                    h += '</tr></thead><tbody>';
                    for (let i = j.logs.length - 1; i >= 1; i--) {
                        h += '<tr>';
                        j.logs[i].forEach(c => h += `<td>${escapeHtml(c)}</td>`);
                        h += '</tr>';
                    }
                    wrap.innerHTML = h + '</tbody></table>';
                } else {
                    wrap.innerHTML = `<p style='padding:20px; color:var(--error)'>${escapeHtml(j.msg)}</p>`;
                }
            } catch(e) { wrap.innerHTML = "<p style='padding:20px; color:var(--error)'>Error.</p>"; }
        }

        // ─── SCOUTERS ────────────────────────────────────────────────────────
        async function loadAllScouters() {
            const wrap = document.getElementById('scouters-wrap');
            wrap.innerHTML = "<p style='padding:20px; text-align:center; color:var(--text-dim)'>Loading...</p>";
            try {
                const signed = await buildSignedParams({ action: 'supergetscouters', sessionToken: sessionTokenVar });
                const r = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
                const j = await r.json();
                if (j.success) {
                    if (!j.scouters.length) {
                        wrap.innerHTML = "<p style='padding:20px; text-align:center; color:var(--text-dim)'>No scouters.</p>";
                        return;
                    }
                    let h = `<table><thead><tr>
                        <th>Name</th><th>Scouter ID</th><th>Team</th><th style="width:70px">Del</th>
                    </tr></thead><tbody>`;
                    j.scouters.forEach(s => {
                        h += `<tr>
                            <td>${escapeHtml(s.name)}</td>
                            <td style="color:var(--accent)">${escapeHtml(s.id)}</td>
                            <td>${escapeHtml(s.team)}</td>
                            <td>
                                <button onclick="deleteSuperScouter(${s.row})" style="background:none; border:none; color:var(--error); cursor:pointer; font-size:13px; font-weight:bold; padding:2px 6px">&#x2715;</button>
                            </td>
                        </tr>`;
                    });
                    wrap.innerHTML = h + '</tbody></table>';
                } else {
                    wrap.innerHTML = `<p style='padding:20px; color:var(--error)'>${escapeHtml(j.msg)}</p>`;
                }
            } catch(e) { wrap.innerHTML = "<p style='padding:20px; color:var(--error)'>Error.</p>"; }
        }

        async function deleteSuperScouter(rowIndex) {
            if (!confirm("Delete this scouter permanently?")) return;
            try {
                const signed = await buildSignedParams({ action: 'superdeletescouter', sessionToken: sessionTokenVar, rowIndex });
                const r = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
                const j = await r.json();
                if (j.success) { showToast("Scouter deleted."); loadAllScouters(); }
                else showToast(j.msg || "Error.");
            } catch(e) { showToast("Connection error."); }
        }

        // ─── EVENTS ──────────────────────────────────────────────────────────
        async function loadAllEvents() {
            const wrap = document.getElementById('events-wrap');
            wrap.innerHTML = "<p style='padding:20px; text-align:center; color:var(--text-dim)'>Loading...</p>";
            try {
                const signed = await buildSignedParams({ action: 'supergetevents', sessionToken: sessionTokenVar });
                const r = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
                const j = await r.json();
                if (j.success) {
                    if (!j.events.length) {
                        wrap.innerHTML = "<p style='padding:20px; text-align:center; color:var(--text-dim)'>No events.</p>";
                        return;
                    }
                    let h = `<table><thead><tr>
                        <th>Code</th><th>Name</th><th>Date</th><th>Team</th>
                    </tr></thead><tbody>`;
                    j.events.forEach(e => {
                        h += `<tr>
                            <td style="color:var(--accent); font-weight:700">${escapeHtml(e.code)}</td>
                            <td>${escapeHtml(e.name)}</td>
                            <td style="color:var(--text-dim); font-size:12px">${escapeHtml(e.date || '-')}</td>
                            <td>${escapeHtml(e.teamId)}</td>
                        </tr>`;
                    });
                    wrap.innerHTML = h + '</tbody></table>';
                } else {
                    wrap.innerHTML = `<p style='padding:20px; color:var(--error)'>${escapeHtml(j.msg)}</p>`;
                }
            } catch(e) { wrap.innerHTML = "<p style='padding:20px; color:var(--error)'>Error.</p>"; }
        }

        // ─── MAIL ────────────────────────────────────────────────────────────
        function populateMailRecipients() {
            if (!teamsCache.length) { loadTeams().then(() => renderMailTeamList('')); return; }
            renderMailTeamList('');
        }

        function filterMailRecipients(query) {
            renderMailTeamList(query.toLowerCase());
        }

        function renderMailTeamList(filter) {
            const list = document.getElementById('mail-team-list');
            if (!list) return;
            const filtered = teamsCache.filter(t =>
                !filter || t.teamId.toString().includes(filter) || t.email.toLowerCase().includes(filter)
            );
            let h = `<label style="display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:13px;font-weight:700">
                <input type="checkbox" id="mail-select-all" onchange="toggleSelectAll(this.checked)">
                All teams (${teamsCache.length})
            </label><div style="border-top:1px solid var(--border);margin:5px 0"></div>`;
            filtered.forEach(t => {
                h += `<label style="display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;font-size:13px">
                    <input type="checkbox" class="mail-team-cb" value="${escapeHtml(t.teamId)}" onchange="updateSelectedCount()">
                    <span style="color:var(--accent);font-weight:700">${escapeHtml(t.teamId)}</span>
                    <span style="color:var(--text-dim)">${escapeHtml(t.email)}</span>
                </label>`;
            });
            list.innerHTML = h;
            updateSelectedCount();
        }

        function toggleSelectAll(checked) {
            document.querySelectorAll('.mail-team-cb').forEach(cb => { cb.checked = checked; });
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const checked = document.querySelectorAll('.mail-team-cb:checked').length;
            const total   = document.querySelectorAll('.mail-team-cb').length;
            const el = document.getElementById('mail-selected-count');
            if (el) el.textContent = checked + ' recipient' + (checked !== 1 ? 's' : '') + ' selected';
            const sa = document.getElementById('mail-select-all');
            if (sa) sa.checked = total > 0 && checked === total;
        }

        async function sendSuperMail() {
            const checked = [...document.querySelectorAll('.mail-team-cb:checked')].map(cb => cb.value);
            if (!checked.length) return showToast("Select at least one recipient.");

            const recipient = checked.length === teamsCache.length ? 'all' : checked.join(',');
            const subject   = sanitizeInput(document.getElementById('mail-subject').value, 200);
            const body      = document.getElementById('mail-body').value;

            if (!subject) return showToast("Subject is required.");
            if (!body)    return showToast("Message body is required.");

            const btn = document.getElementById('btn-send-mail');
            btn.disabled = true; btn.innerText = "SENDING...";

            try {
                const signed = await buildSignedParams({
                    action: 'supersendmail',
                    sessionToken: sessionTokenVar,
                    recipient,
                    subject,
                    body
                });
                const r = await fetch(`${SCRIPT_URL}?${new URLSearchParams(signed)}`);
                const j = await r.json();
                if (j.success) {
                    showToast(`Sent to ${j.sent} team(s).${j.failed ? ' ' + j.failed + ' failed.' : ''}`);
                    document.getElementById('mail-subject').value = '';
                    document.getElementById('mail-body').value    = '';
                    document.getElementById('body-counter').textContent = '0/1000';
                    document.querySelectorAll('.mail-team-cb, #mail-select-all').forEach(cb => cb.checked = false);
                    updateSelectedCount();
                } else {
                    showToast(j.msg || "Error.");
                }
            } catch(e) {
                showToast("Connection error.");
            } finally {
                btn.disabled = false; btn.innerText = "SEND EMAIL";
            }
        }
    </script>
</body>
</html>
